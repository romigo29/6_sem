version: "3.9"

services:
  backend:
    build: ./backend
    container_name: node_backend
    restart: always
    expose:
      - "40000"

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "20000:20000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
