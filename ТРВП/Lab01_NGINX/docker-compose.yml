services:
  backend:
    build: ./backend
    container_name: node_backend
    restart: always
    ports:
      - "40000:40000"

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "20443:20443"
      - "20000:20000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/static:/usr/share/nginx/html/static
      - ./nginx/static-react:/usr/share/nginx/html/static-react
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
